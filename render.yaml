# =============================================================================
# Render Blueprint Configuration (Infrastructure-as-Code)
# Deploys PostgreSQL + Spring Boot Backend + Next.js Frontend on Render.com
# =============================================================================

databases:
  - name: gcam-postgres
    databaseName: git_collabration
    plan: free

services:
  # =========================================================================
  # 1. Spring Boot Backend (Java 23)
  # =========================================================================
  - type: web
    name: gcam-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: gcam-shared
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: gcam-postgres
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: gcam-postgres
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: gcam-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: gcam-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: gcam-postgres
          property: password
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m -XX:ReservedCodeCacheSize=64m -XX:+UseContainerSupport"

  # =========================================================================
  # 2. Next.js Frontend (React 19 / Prisma)
  # =========================================================================
  - type: web
    name: gcam-frontend
    runtime: docker
    dockerContext: ./git-collabration
    dockerfilePath: ./git-collabration/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: gcam-shared
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: gcam-postgres
          property: connectionString
      - key: SPRING_BOOT_URL
        fromService:
          type: web
          name: gcam-backend
          property: host

# =============================================================================
# Shared Environment Variables Group
# Synchronizes secrets and authentication between Frontend and Backend
# =============================================================================
envVarGroups:
  - name: gcam-shared
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: change-me
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_OWNER
        value: Shubham-rawat2004
